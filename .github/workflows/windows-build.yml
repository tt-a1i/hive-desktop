name: Windows desktop build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/hive-desktop-target
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck runtime
        run: pnpm --filter @hive-desktop/runtime check
      - name: Build runtime
        run: pnpm build:runtime
      - name: Build desktop executable
        run: cargo build --locked --manifest-path apps/desktop/Cargo.toml
      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: hive-desktop-windows-executable
          path: ${{ runner.temp }}/hive-desktop-target/debug/hive-desktop.exe
          if-no-files-found: error
