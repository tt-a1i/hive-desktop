name: Windows desktop build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target/windows-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck runtime
        run: pnpm --filter @hive-desktop/runtime check
      - name: Build runtime
        run: pnpm build:runtime
      - name: Build desktop executable
        run: cargo build --locked --manifest-path apps/desktop/Cargo.toml
      - name: Compile runtime location tests
        run: rustc --edition 2021 --test apps/desktop/src/runtime_location.rs -o target/runtime-location-tests.exe
      - name: Run runtime location tests
        run: ./target/runtime-location-tests.exe
      - name: Deploy locked production runtime
        run: pnpm --filter @hive-desktop/runtime deploy --prod --frozen-lockfile --node-linker=hoisted target/deployed-runtime
      - name: Package portable desktop
        run: node scripts/package-desktop.mjs --executable target/windows-desktop/debug/hive-desktop.exe --runtime target/deployed-runtime --output target/portable-windows
      - name: Zip portable folder
        run: Compress-Archive -Path target/portable-windows/* -DestinationPath target/hive-desktop-windows-portable.zip
      - name: Extract final zip
        run: Expand-Archive -Path target/hive-desktop-windows-portable.zip -DestinationPath target/portable-windows-extracted
      - name: Smoke extracted runtime and PTY
        timeout-minutes: 5
        run: node scripts/check-package.mjs --bundle target/portable-windows-extracted
      - name: Upload portable desktop
        uses: actions/upload-artifact@v4
        with:
          name: hive-desktop-windows-portable
          path: target/hive-desktop-windows-portable.zip
          if-no-files-found: error
  native-clis:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build runtime
        run: pnpm build:runtime
      - name: Verify official external CLIs without inference
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:HIVE_WINDOWS_NATIVE_CLI_PREFIX = Join-Path $env:RUNNER_TEMP 'official native CLI space'
          npm install --global --prefix "$env:HIVE_WINDOWS_NATIVE_CLI_PREFIX" @earendil-works/pi-coding-agent@1.4.0 @openai/codex@0.166.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime exec tsx checks/windows-native-clis.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload external CLI check receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-cli-receipt
          path: .artifacts/windows-native-clis.json
          if-no-files-found: warn
