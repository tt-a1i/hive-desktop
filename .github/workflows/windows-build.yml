name: Windows desktop build

on:
  workflow_dispatch:
    inputs:
      replay_run:
        description: Existing Windows run ID whose portable artifact will be replayed
        required: false
        type: string
      replay_scenario:
        description: Optional isolated replay scenario
        required: false
        type: choice
        default: standard
        options:
          - standard
          - project-reference
          - git-preview
          - worktree-dirty
          - worktree-remove
          - archived-search
          - reading-position
          - codex-quota
          - handoff-range
          - queued-inputs
          - queued-stop-rejection
          - queued-stop-declined
          - checkpoint-comparison
      replay_update:
        description: Replay only native update and rollback from the retained portable artifact
        required: false
        type: boolean
        default: false
      replay_image_memory:
        description: Run the isolated 48-image Windows window and memory acceptance
        required: false
        type: boolean
        default: false
      replay_shortcut_layout:
        description: Replay only the isolated Windows keyboard-layout shortcut acceptance
        required: false
        type: boolean
        default: false
      replay_functional:
        description: Check the exact retained package before replaying its native window
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'vendor/**'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'vendor/**'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.replay_run && !inputs.replay_image_memory && !inputs.replay_shortcut_layout && !inputs.replay_update && (inputs.replay_scenario == '' || inputs.replay_scenario == 'standard')) }}
    runs-on: windows-latest
    # The full build reached native update after 52 minutes on a hosted runner.
    # Leave room for its separate 18-minute deadline and receipt upload.
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: target/windows-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out source before building
        id: package_source
        shell: pwsh
        run: |
          $head = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cnotmatch '^[0-9a-f]{40}$') { throw 'Could not identify checked-out source.' }
          $dirty = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Tracked source is not clean before building.' }
          "head=$head" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck runtime
        run: pnpm --filter @hive-desktop/runtime check
      - name: Build runtime
        run: pnpm build:runtime
      - name: Check Codex history and tool lifecycle without vendor requests
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:codex
      - name: Check history control, fork provenance and session wire without vendor requests
        timeout-minutes: 5
        shell: pwsh
        run: |
          pnpm --filter @hive-desktop/runtime exec tsx checks/codex-history-control.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime exec tsx checks/codex-fork-provenance.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime exec tsx checks/session-history-wire.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check profiles and ACP against controlled peers without vendor requests
        timeout-minutes: 10
        shell: pwsh
        run: |
          $checks = @('agent-profiles', 'structured-launch', 'profile-runtime-binding', 'profile-runtime-wire',
            'profile-settings-atomic', 'profile-claude-offline-history', 'codex-history-profile-launch',
            'acp-session', 'acp-team-stdio', 'acp-team-hive', 'acp-runtime-registration', 'acp-startup-shutdown',
            'profile-executable-probe')
          foreach ($check in $checks) {
            pnpm --filter @hive-desktop/runtime exec tsx "checks/$check.ts"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check offline handoffs and first-delivery recovery without vendor requests
        timeout-minutes: 10
        run: pnpm --filter @hive-desktop/runtime check:handoff
      - name: Check question attachment ownership and reply lifecycle without vendor requests
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:interaction-attachments
      - name: Check Pi authentication without vendor requests
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:pi-auth
      - name: Check Pi model configuration files
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:pi-models
      - name: Check durable session pinning without Agent requests
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:session-pins
      - name: Check session archives, restoration and dispatch guards
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:session-archives
      - name: Check image payloads and durable native transports
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:images
      - name: Check image upload and Hive message association
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:attachments
      - name: Check queued input mutations and recovery
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime check:queue-mutations
      - name: Check conversation body search
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime check:conversation-search
      - name: Check project file references and snapshots
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime check:project-files
      - name: Check Git index writes and worktree scope through desktop JSONL
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime exec tsx checks/git-index-wire.ts
      - name: Check immutable historical session identity
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime check:session-identity
      - name: Check Worker worktree creation and cold recovery through desktop JSONL
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime exec tsx checks/member-worktrees-wire.ts
      - name: Check saved project script transactions without Agent requests
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime exec tsx checks/project-script-settings.ts
      - name: Check Codex account limits with controlled native peers
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:codex-limits
      - name: Check session terminals with native Windows PTYs
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime exec tsx checks/session-terminals-windows.ts --receipt target/session-terminals-windows.json
      - name: Check delayed native PTY PID publication
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:pty-live-pid
      - name: Check saved project scripts with native Windows processes
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime exec tsx checks/project-scripts-windows.ts --receipt target/project-scripts-windows.json
      - name: Upload project script receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-project-scripts-receipt
          path: packages/runtime/target/project-scripts-windows.json
          if-no-files-found: warn
      - name: Upload session terminal receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-session-terminals-receipt
          path: packages/runtime/target/session-terminals-windows.json
          if-no-files-found: warn
      - name: Build desktop executable
        run: cargo build --locked --release --manifest-path apps/desktop/Cargo.toml --bin hive-desktop
      - name: Compile runtime location tests
        run: rustc --edition 2021 --test apps/desktop/src/runtime_location.rs -o target/runtime-location-tests.exe
      - name: Run runtime location tests
        run: ./target/runtime-location-tests.exe
      - name: Test terminal parser with desktop lockfile
        run: cargo test --locked --manifest-path apps/desktop/Cargo.toml -p hive-terminal --lib
      - name: Deploy locked production runtime
        run: pnpm --filter @hive-desktop/runtime deploy --prod --frozen-lockfile --node-linker=hoisted target/deployed-runtime
      - name: Package portable desktop
        run: node scripts/package-desktop.mjs --executable target/windows-desktop/release/hive-desktop.exe --runtime target/deployed-runtime --output target/portable-windows
      - name: Zip portable folder
        run: Compress-Archive -Path target/portable-windows/* -DestinationPath target/hive-desktop-windows-portable.zip
      - name: Record portable artifact source
        shell: pwsh
        env:
          PACKAGE_SOURCE: ${{ steps.package_source.outputs.head }}
        run: |
          $head = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:PACKAGE_SOURCE) { throw 'Source checkout changed during packaging.' }
          $dirty = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Tracked source changed during packaging.' }
          [ordered]@{ schemaVersion = 1; repository = $env:GITHUB_REPOSITORY; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT; event = $env:GITHUB_EVENT_NAME; checkoutHead = $head; archiveSha256 = (Get-FileHash -Algorithm SHA256 target/hive-desktop-windows-portable.zip).Hash } | ConvertTo-Json | Set-Content -Encoding utf8 target/hive-desktop-windows-source.json
      # Keep the exact generated binary available if a later acceptance check fails.
      # Artifact availability is not a passing validation result or release promotion.
      - name: Preserve generated portable desktop
        uses: actions/upload-artifact@v4
        with:
          name: hive-desktop-windows-portable
          path: |
            target/hive-desktop-windows-portable.zip
            target/hive-desktop-windows-source.json
          if-no-files-found: error
      - name: Extract final zip
        run: Expand-Archive -Path target/hive-desktop-windows-portable.zip -DestinationPath target/portable-windows-extracted
      - name: Smoke extracted runtime and PTY
        id: extracted_runtime
        timeout-minutes: 5
        run: node scripts/check-package.mjs --bundle target/portable-windows-extracted
      - name: Check extracted Codex lifecycle without vendor requests
        timeout-minutes: 3
        run: node scripts/check-packaged-codex.mjs --bundle target/portable-windows-extracted
      - name: Check extracted functional runtime
        timeout-minutes: 25
        run: node scripts/check-packaged-functional.mjs --bundle target/portable-windows-extracted --receipt target/functional-receipt.json
      - name: Upload extracted functional receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-functional-receipt
          path: target/functional-receipt.json
          if-no-files-found: warn
      - name: Smoke extracted Windows terminal bridge
        timeout-minutes: 5
        shell: pwsh
        run: |
          node scripts/check-windows-terminal.mjs --bundle target/portable-windows-extracted 2>&1 | Tee-Object -FilePath target/windows-terminal-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload terminal smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-terminal-smoke-log
          path: target/windows-terminal-smoke.log
          if-no-files-found: ignore
      - name: Open the saved workspace in the extracted native application
        if: ${{ !cancelled() && steps.extracted_runtime.outcome == 'success' }}
        timeout-minutes: 5
        env:
          HIVE_WINDOWS_PREVIEW_PATH: target/windows-native-workspace.png
          HIVE_WINDOWS_HTML_PREVIEW: '1'
        run: node scripts/check-desktop-startup.mjs --bundle target/portable-windows-extracted
      - name: Upload native workspace preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-workspace
          path: |
            target/windows-*.png
            target/windows-html-preview-*.json
          if-no-files-found: warn
      - name: Verify update and rollback from the extracted Windows desktop
        if: ${{ !cancelled() && steps.extracted_runtime.outcome == 'success' }}
        timeout-minutes: 18
        run: node scripts/check-windows-native-update.mjs --bundle target/portable-windows-extracted --build-candidate --receipt target/windows-native-update.json
      - name: Preserve native update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-update-receipt
          path: target/windows-native-update.json
          if-no-files-found: warn
  native-supervision:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.replay_run && !inputs.replay_image_memory && !inputs.replay_shortcut_layout && !inputs.replay_update && (inputs.replay_scenario == '' || inputs.replay_scenario == 'standard')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build runtime
        run: pnpm build:runtime
      - name: Test native process supervision
        env:
          HIVE_GIT_HOOK_RECEIPT: ${{ github.workspace }}/target/windows-git-hook-ownership.json
          HIVE_VAULT_OWNER_RECEIPT: ${{ github.workspace }}/target/windows-vault-ownership.json
        run: cargo test --locked --manifest-path apps/desktop/Cargo.toml --no-default-features --features process-supervisor-check --bin process-supervisor-check -- --nocapture
      - name: Preserve native Git hook ownership receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-git-hook-ownership
          path: target/windows-git-hook-ownership.json
          if-no-files-found: warn
      - name: Preserve Windows vault ownership receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-vault-ownership
          path: target/windows-vault-ownership.json
          if-no-files-found: warn
  native-clis:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.replay_run && !inputs.replay_image_memory && !inputs.replay_shortcut_layout && !inputs.replay_update && (inputs.replay_scenario == '' || inputs.replay_scenario == 'standard')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build runtime
        run: pnpm build:runtime
      - name: Verify official external CLIs without inference
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:HIVE_WINDOWS_NATIVE_CLI_PREFIX = Join-Path $env:RUNNER_TEMP 'official native CLI space'
          npm install --global --prefix "$env:HIVE_WINDOWS_NATIVE_CLI_PREFIX" @earendil-works/pi-coding-agent@1.4.0 @openai/codex@0.166.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime exec tsx checks/windows-process-observer-check.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime exec tsx checks/windows-native-clis.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HIVE_PI_COMMAND = Join-Path $env:HIVE_WINDOWS_NATIVE_CLI_PREFIX 'pi.cmd'
          $env:HIVE_CODEX_COMMAND = Join-Path $env:HIVE_WINDOWS_NATIVE_CLI_PREFIX 'codex.cmd'
          pnpm --filter @hive-desktop/runtime check:programs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime check:files
          pnpm --filter @hive-desktop/runtime check:delivery-failures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime check:pi-reasoning
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload external CLI check receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-cli-receipt
          path: |
            .artifacts/windows-native-clis.json
            .artifacts/program-check/*.json
            .artifacts/file-attachments/core-receipt.json
            .artifacts/file-attachments/wire-receipt.json
          if-no-files-found: warn
  replay:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.replay_update && (inputs.replay_run != '' || inputs.replay_image_memory || inputs.replay_shortcut_layout || (inputs.replay_scenario != '' && inputs.replay_scenario != 'standard')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REPLAY_RUN: ${{ inputs.replay_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
      - uses: pnpm/action-setup@v6
        if: ${{ (inputs.replay_functional && !inputs.replay_image_memory && !inputs.replay_shortcut_layout && (!inputs.replay_scenario || inputs.replay_scenario == 'standard')) || inputs.replay_scenario == 'checkpoint-comparison' }}
        with:
          version: 10.30.3
      - name: Install package-check compiler only without lifecycle scripts
        if: ${{ (inputs.replay_functional && !inputs.replay_image_memory && !inputs.replay_shortcut_layout && (!inputs.replay_scenario || inputs.replay_scenario == 'standard')) || inputs.replay_scenario == 'checkpoint-comparison' }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject incompatible replay selections
        shell: pwsh
        env:
          IMAGE_REPLAY: ${{ inputs.replay_image_memory }}
          FUNCTIONAL_REPLAY: ${{ inputs.replay_functional }}
          SHORTCUT_REPLAY: ${{ inputs.replay_shortcut_layout }}
          REPLAY_SCENARIO: ${{ inputs.replay_scenario }}
        run: |
          if ($env:REPLAY_SCENARIO -notin @('', 'standard', 'project-reference', 'git-preview', 'worktree-dirty', 'worktree-remove', 'archived-search', 'reading-position', 'handoff-range', 'codex-quota', 'queued-inputs', 'queued-stop-rejection', 'queued-stop-declined', 'checkpoint-comparison')) { throw 'Unknown replay scenario.' }
          if ($env:REPLAY_SCENARIO -notin @('', 'standard') -and ($env:IMAGE_REPLAY -eq 'true' -or $env:FUNCTIONAL_REPLAY -eq 'true' -or $env:SHORTCUT_REPLAY -eq 'true')) { throw 'A named replay scenario cannot be combined with other replay selections.' }
          if ($env:SHORTCUT_REPLAY -eq 'true' -and ($env:IMAGE_REPLAY -eq 'true' -or $env:FUNCTIONAL_REPLAY -eq 'true')) { throw 'Shortcut layout replay cannot be combined with image, functional, or default WebView replay.' }
      - name: Validate original run ID
        shell: pwsh
        run: |
          if ($env:REPLAY_RUN -cnotmatch '^[1-9][0-9]*$') { throw 'replay_run must be a positive integer.' }
      - name: Download original portable artifact
        uses: actions/download-artifact@v4
        with:
          name: hive-desktop-windows-portable
          path: target/replay-download
          run-id: ${{ env.REPLAY_RUN }}
          github-token: ${{ github.token }}
      - name: Extract and record provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_SCENARIO: ${{ inputs.replay_scenario }}
        run: |
          $archive = 'target/replay-download/hive-desktop-windows-portable.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Original portable zip is missing from artifact.' }
          $origin = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:REPLAY_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $origin.head_sha) { throw 'Could not read original run provenance.' }
          if ($env:REPLAY_SCENARIO -eq 'checkpoint-comparison') {
            if ($origin.event -ne 'push' -or $origin.repository.full_name -ne $env:GITHUB_REPOSITORY -or $origin.head_repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Checkpoint comparison requires a push from this repository.' }
            if ($origin.head_sha -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid original source commit.' }
            "CHECKPOINT_SOURCE_HEAD=$($origin.head_sha)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          New-Item -ItemType Directory -Force -Path target | Out-Null
          [ordered]@{ originalRun = $env:REPLAY_RUN; originalHead = $origin.head_sha; fixtureHead = $env:GITHUB_SHA; archiveSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash } | ConvertTo-Json | Set-Content -Encoding utf8 target/replay-provenance.json
          Expand-Archive -LiteralPath $archive -DestinationPath target/replay-extracted
          if (-not (Test-Path -LiteralPath 'target/replay-extracted/hive-desktop.exe' -PathType Leaf)) { throw 'Extracted artifact is not a portable desktop bundle.' }
      - name: Checkout version-matched functional checks
        if: ${{ inputs.replay_scenario == 'checkpoint-comparison' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKPOINT_SOURCE_HEAD }}
          path: target/checkpoint-functional-source
          persist-credentials: false
      - name: Prepare checkpoint-only fixture overrides
        if: ${{ inputs.replay_scenario == 'checkpoint-comparison' }}
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'target/checkpoint-functional-source'
          $actualChecksHead = git -C $source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualChecksHead -ne $env:CHECKPOINT_SOURCE_HEAD) { throw 'Original fixture checkout does not match package provenance.' }
          $paths = @('packages/runtime/checks/checkpoint-restore.ts', 'scripts/check-packaged-functional.mjs')
          $overrides = @($paths | ForEach-Object {
            $path = $_
            $originalBlob = git -C $source rev-parse "HEAD:$path"
            if ($LASTEXITCODE -ne 0) { throw "Missing original fixture: $path" }
            $overrideBlob = git rev-parse "HEAD:$path"
            if ($LASTEXITCODE -ne 0) { throw "Missing checkpoint override: $path" }
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $path) -Destination (Join-Path $source $path)
            $materializedBlob = git -C $source hash-object --path=$path $path
            if ($LASTEXITCODE -ne 0 -or $materializedBlob -ne $overrideBlob) { throw "Checkpoint override differs from its recorded source: $path" }
            [ordered]@{ path = $path; originalBlob = $originalBlob; overrideBlob = $overrideBlob; materializedBlob = $materializedBlob }
          })
          $changed = @(git -C $source diff --name-only)
          if ($LASTEXITCODE -ne 0 -or @($changed | Where-Object { $_ -notin $paths }).Count -ne 0) { throw 'Version-matched checks contain an unexpected modification.' }
          New-Item -ItemType Junction -Path (Join-Path $source 'packages/runtime/node_modules') -Target (Join-Path $env:GITHUB_WORKSPACE 'packages/runtime/node_modules') | Out-Null
          $original = Get-Content -LiteralPath target/replay-provenance.json -Raw | ConvertFrom-Json
          [ordered]@{ originalRun = $original.originalRun; originalChecksHead = $actualChecksHead; overridesHead = $env:GITHUB_SHA; archiveSha256 = $original.archiveSha256; overrides = $overrides; changedFiles = $changed } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 target/checkpoint-fixture-provenance.json
      - name: Check version-matched functional runtime with checkpoint groups
        if: ${{ inputs.replay_scenario == 'checkpoint-comparison' }}
        timeout-minutes: 25
        run: node target/checkpoint-functional-source/scripts/check-packaged-functional.mjs --bundle target/replay-extracted --receipt target/replay-functional-receipt.json
      - name: Check original extracted functional runtime
        if: ${{ inputs.replay_functional && !inputs.replay_image_memory && !inputs.replay_shortcut_layout && (!inputs.replay_scenario || inputs.replay_scenario == 'standard') }}
        timeout-minutes: 25
        run: node scripts/check-packaged-functional.mjs --bundle target/replay-extracted --receipt target/replay-functional-receipt.json
      - name: Smoke extracted Windows terminal bridge
        if: ${{ !inputs.replay_image_memory && !inputs.replay_shortcut_layout && (!inputs.replay_scenario || inputs.replay_scenario == 'standard') }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          node scripts/check-windows-terminal.mjs --bundle target/replay-extracted 2>&1 | Tee-Object -FilePath target/windows-terminal-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay native window fixture
        if: ${{ !inputs.replay_image_memory && !inputs.replay_shortcut_layout && (!inputs.replay_scenario || inputs.replay_scenario == 'standard') }}
        timeout-minutes: 4
        shell: pwsh
        env:
          HIVE_WINDOWS_PREVIEW_PATH: target/windows-replay-workspace.png
          HIVE_WINDOWS_HTML_PREVIEW: '1'
        run: |
          node scripts/check-desktop-startup.mjs --bundle target/replay-extracted 2>&1 | Tee-Object -FilePath target/windows-replay.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure native history-image memory
        if: ${{ inputs.replay_image_memory && !inputs.replay_shortcut_layout && (!inputs.replay_scenario || inputs.replay_scenario == 'standard') }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          node scripts/check-windows-history-image-memory.mjs --bundle target/replay-extracted --receipt target/windows-image-memory.json 2>&1 | Tee-Object -FilePath target/windows-image-memory.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inventory Windows Chinese input methods
        if: ${{ inputs.replay_shortcut_layout }}
        timeout-minutes: 4
        shell: pwsh
        run: |
          powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File scripts/windows-ime-inventory.ps1 -ReceiptPath (Join-Path $PWD 'target/windows-ime-inventory.json') 2>&1 | Tee-Object -FilePath target/windows-ime-inventory.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Windows shortcut layout changes
        if: ${{ inputs.replay_shortcut_layout }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File scripts/windows-shortcut-layout-ci.ps1 -FixtureExe (Resolve-Path 'target/replay-extracted/hive-desktop.exe').Path -ReceiptPath (Join-Path $PWD 'target/windows-shortcut-layout.json') 2>&1 | Tee-Object -FilePath target/windows-shortcut-layout.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay native Git staged preview and cancellation
        if: ${{ inputs.replay_scenario == 'git-preview' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          node scripts/check-windows-git-preview.mjs --bundle target/replay-extracted --receipt target/windows-git-preview.json 2>&1 | Tee-Object -FilePath target/windows-git-preview.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reject cleanup of a modified Windows worktree
        if: ${{ inputs.replay_scenario == 'worktree-dirty' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          node scripts/check-windows-worktree-dirty.mjs --bundle target/replay-extracted --receipt target/windows-worktree-dirty.json 2>&1 | Tee-Object -FilePath target/windows-worktree-dirty.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm removal of a clean Windows worktree
        if: ${{ inputs.replay_scenario == 'worktree-remove' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          node scripts/check-windows-worktree-remove.mjs --bundle target/replay-extracted --receipt target/windows-worktree-remove.json 2>&1 | Tee-Object -FilePath target/windows-worktree-remove.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay native worktree project reference
        if: ${{ inputs.replay_scenario == 'project-reference' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          node scripts/check-windows-project-reference.mjs --bundle target/replay-extracted --receipt target/windows-project-reference.json 2>&1 | Tee-Object -FilePath target/windows-project-reference.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay archived search with a missing worktree
        if: ${{ inputs.replay_scenario == 'archived-search' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          node scripts/check-windows-archived-search.mjs --bundle target/replay-extracted --receipt target/windows-archived-search.json 2>&1 | Tee-Object -FilePath target/windows-archived-search.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay cold reading position on Windows
        if: ${{ inputs.replay_scenario == 'reading-position' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          node scripts/check-windows-archived-search.mjs --reading-position --bundle target/replay-extracted --receipt target/windows-reading-position.json 2>&1 | Tee-Object -FilePath target/windows-reading-position.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay handoff range preview without activation
        if: ${{ inputs.replay_scenario == 'handoff-range' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          node scripts/check-windows-archived-search.mjs --handoff-range --bundle target/replay-extracted --receipt target/windows-handoff-range.json 2>&1 | Tee-Object -FilePath target/windows-handoff-range.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay native Codex quota and process cleanup
        if: ${{ inputs.replay_scenario == 'codex-quota' }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          node scripts/check-windows-codex-quota.mjs --bundle target/replay-extracted --receipt target/windows-codex-quota.json 2>&1 | Tee-Object -FilePath target/windows-codex-quota.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay native queued input edit and cancellation
        if: ${{ inputs.replay_scenario == 'queued-inputs' || inputs.replay_scenario == 'queued-stop-rejection' || inputs.replay_scenario == 'queued-stop-declined' }}
        timeout-minutes: 8
        shell: pwsh
        env:
          QUEUE_REPLAY_SCENARIO: ${{ inputs.replay_scenario }}
        run: |
          $scenarioArgs = @()
          if ($env:QUEUE_REPLAY_SCENARIO -eq 'queued-stop-rejection') { $scenarioArgs += '--stop-rejection' }
          if ($env:QUEUE_REPLAY_SCENARIO -eq 'queued-stop-declined') { $scenarioArgs += '--definite-rejection' }
          node scripts/check-windows-queued-inputs.mjs @scenarioArgs --bundle target/replay-extracted --receipt "target/windows-$($env:QUEUE_REPLAY_SCENARIO).json" 2>&1 | Tee-Object -FilePath "target/windows-$($env:QUEUE_REPLAY_SCENARIO).log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-replay-evidence
          path: |
            target/windows-*.png
            target/windows-replay.log
            target/windows-html-preview-*.json
            target/windows-terminal-smoke.log
            target/replay-provenance.json
            target/checkpoint-fixture-provenance.json
            target/replay-functional-receipt.json
            target/windows-image-memory.json
            target/windows-image-memory.log
            target/windows-image-desktop.log
            target/windows-ime-inventory.json
            target/windows-ime-inventory.log
            target/windows-shortcut-layout.json
            target/windows-shortcut-layout-ui.json
            target/windows-shortcut-layout.log
            target/windows-worktree-remove*.json
            target/windows-worktree-remove*.log
            target/windows-worktree-dirty*.json
            target/windows-worktree-dirty*.log
            target/windows-git-preview*.json
            target/windows-git-preview*.log
            target/windows-project-reference.json
            target/windows-project-reference.log
            target/windows-project-reference-desktop.log
            target/windows-reading-*.json
            target/windows-reading-*.log
            target/windows-archived-search*.json
            target/windows-archived-search*.log
            target/windows-codex-quota.json
            target/windows-codex-quota.log
            target/windows-codex-quota-desktop.log
            target/windows-handoff-range*.json
            target/windows-handoff-range*.log
            target/windows-queued-inputs*.json
            target/windows-queued-inputs*.log
            target/windows-queued-stop-rejection*.json
            target/windows-queued-stop-rejection*.log
            target/windows-queued-stop-declined*.json
            target/windows-queued-stop-declined*.log
          if-no-files-found: warn

  replay-update:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_update }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      REPLAY_RUN: ${{ inputs.replay_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Validate isolated update replay selection
        shell: pwsh
        env:
          IMAGE_REPLAY: ${{ inputs.replay_image_memory }}
          FUNCTIONAL_REPLAY: ${{ inputs.replay_functional }}
          SHORTCUT_REPLAY: ${{ inputs.replay_shortcut_layout }}
          REPLAY_SCENARIO: ${{ inputs.replay_scenario }}
        run: |
          if ($env:REPLAY_RUN -cnotmatch '^[1-9][0-9]*$') { throw 'replay_run must be a positive integer.' }
          if ($env:IMAGE_REPLAY -eq 'true' -or $env:FUNCTIONAL_REPLAY -eq 'true' -or $env:SHORTCUT_REPLAY -eq 'true' -or ($env:REPLAY_SCENARIO -ne '' -and $env:REPLAY_SCENARIO -ne 'standard')) { throw 'Update replay cannot be combined with other replay selections.' }
      - name: Download original portable artifact
        uses: actions/download-artifact@v4
        with:
          name: hive-desktop-windows-portable
          path: target/replay-download
          run-id: ${{ env.REPLAY_RUN }}
          github-token: ${{ github.token }}
      - name: Extract and record provenance
        id: provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = 'target/replay-download/hive-desktop-windows-portable.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Original portable zip is missing from artifact.' }
          $origin = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:REPLAY_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $origin.head_sha -cnotmatch '^[0-9a-f]{40}$') { throw 'Could not read original run provenance.' }
          $workflow = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$($origin.workflow_id)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $workflow.path -cne '.github/workflows/windows-build.yml') { throw 'The run is not from the Windows build workflow.' }
          $archiveSha = (Get-FileHash -Algorithm SHA256 $archive).Hash
          $sourceReceipt = 'target/replay-download/hive-desktop-windows-source.json'
          if (Test-Path -LiteralPath $sourceReceipt -PathType Leaf) {
            $source = Get-Content -Raw -LiteralPath $sourceReceipt | ConvertFrom-Json
            if ($source.schemaVersion -ne 1 -or $source.repository -cne $env:GITHUB_REPOSITORY -or "$($source.runId)" -cne $env:REPLAY_RUN -or "$($source.runAttempt)" -cne "$($origin.run_attempt)" -or $source.event -cne $origin.event -or $source.checkoutHead -cnotmatch '^[0-9a-f]{40}$' -or $source.archiveSha256 -cne $archiveSha) { throw 'Portable source receipt does not match the downloaded artifact and run.' }
            $checkoutHead = $source.checkoutHead
            $sourceMethod = 'artifact-checkout-receipt'
          } elseif ($origin.event -ceq 'push') {
            # This workflow uses the default checkout for push runs: its ref is the push SHA.
            $checkoutHead = $origin.head_sha
            $sourceMethod = 'legacy-push-head-sha'
          } else {
            throw 'This older non-push artifact has no checkout receipt; its source revision cannot be established safely.'
          }
          New-Item -ItemType Directory -Force -Path target | Out-Null
          [ordered]@{ originalRun = $env:REPLAY_RUN; originalEvent = $origin.event; originalHead = $origin.head_sha; checkoutHead = $checkoutHead; sourceMethod = $sourceMethod; fixtureHead = $env:GITHUB_SHA; archiveSha256 = $archiveSha } | ConvertTo-Json | Set-Content -Encoding utf8 target/replay-provenance.json
          "head=$checkoutHead" >> $env:GITHUB_OUTPUT
          Expand-Archive -LiteralPath $archive -DestinationPath target/replay-extracted
          if (-not (Test-Path -LiteralPath 'target/replay-extracted/hive-desktop.exe' -PathType Leaf)) { throw 'Extracted artifact is not a portable desktop bundle.' }
      - name: Check out the original package source for the candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.provenance.outputs.head }}
          path: target/update-source
      - name: Verify candidate source checkout
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ steps.provenance.outputs.head }}
        run: |
          $actual = (git -C target/update-source rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SOURCE) { throw 'Candidate source checkout does not match package provenance.' }
      - name: Replay native update and rollback
        timeout-minutes: 60
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hive-update-replay-target
        run: |
          node scripts/check-windows-native-update.mjs --bundle target/replay-extracted --build-candidate --candidate-source target/update-source --receipt target/windows-native-update.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve failure receipt when replay did not reach the native check
        if: ${{ always() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target | Out-Null
          if (-not (Test-Path -LiteralPath target/windows-native-update.json -PathType Leaf)) {
            [ordered]@{ ok = $false; error = 'Replay stopped before the native update check wrote a receipt.'; originalRun = $env:REPLAY_RUN } | ConvertTo-Json | Set-Content -Encoding utf8 target/windows-native-update.json
          }
      - name: Upload native update replay evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-update-replay-evidence
          path: |
            target/replay-provenance.json
            target/windows-native-update.json
          if-no-files-found: warn
