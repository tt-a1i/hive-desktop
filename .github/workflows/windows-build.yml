name: Windows desktop build

on:
  workflow_dispatch:
    inputs:
      replay_run:
        description: Existing Windows run ID whose portable artifact will be replayed
        required: false
        type: string
  push:
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'vendor/**'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'vendor/**'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.replay_run }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target/windows-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck runtime
        run: pnpm --filter @hive-desktop/runtime check
      - name: Build runtime
        run: pnpm build:runtime
      - name: Check Codex history and tool lifecycle without vendor requests
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:codex
      - name: Check Pi authentication without vendor requests
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:pi-auth
      - name: Check Pi model configuration files
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:pi-models
      - name: Check durable session pinning without Agent requests
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:session-pins
      - name: Check session archives, restoration and dispatch guards
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:session-archives
      - name: Check image payloads and durable native transports
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:images
      - name: Check image upload and Hive message association
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime check:attachments
      - name: Check queued input mutations and recovery
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime check:queue-mutations
      - name: Check conversation body search
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime check:conversation-search
      - name: Check project file references and snapshots
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime check:project-files
      - name: Check Git index writes and worktree scope through desktop JSONL
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime exec tsx checks/git-index-wire.ts
      - name: Check immutable historical session identity
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime check:session-identity
      - name: Check Worker worktree creation and cold recovery through desktop JSONL
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime exec tsx checks/member-worktrees-wire.ts
      - name: Check saved project script transactions without Agent requests
        timeout-minutes: 3
        run: pnpm --filter @hive-desktop/runtime exec tsx checks/project-script-settings.ts
      - name: Check session terminals with native Windows PTYs
        timeout-minutes: 5
        run: pnpm --filter @hive-desktop/runtime exec tsx checks/session-terminals-windows.ts --receipt target/session-terminals-windows.json
      - name: Upload session terminal receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-session-terminals-receipt
          path: packages/runtime/target/session-terminals-windows.json
          if-no-files-found: warn
      - name: Build desktop executable
        run: cargo build --locked --release --manifest-path apps/desktop/Cargo.toml --bin hive-desktop
      - name: Compile runtime location tests
        run: rustc --edition 2021 --test apps/desktop/src/runtime_location.rs -o target/runtime-location-tests.exe
      - name: Run runtime location tests
        run: ./target/runtime-location-tests.exe
      - name: Test terminal parser with desktop lockfile
        run: cargo test --locked --manifest-path apps/desktop/Cargo.toml -p hive-terminal --lib
      - name: Deploy locked production runtime
        run: pnpm --filter @hive-desktop/runtime deploy --prod --frozen-lockfile --node-linker=hoisted target/deployed-runtime
      - name: Package portable desktop
        run: node scripts/package-desktop.mjs --executable target/windows-desktop/release/hive-desktop.exe --runtime target/deployed-runtime --output target/portable-windows
      - name: Zip portable folder
        run: Compress-Archive -Path target/portable-windows/* -DestinationPath target/hive-desktop-windows-portable.zip
      - name: Extract final zip
        run: Expand-Archive -Path target/hive-desktop-windows-portable.zip -DestinationPath target/portable-windows-extracted
      - name: Smoke extracted runtime and PTY
        timeout-minutes: 5
        run: node scripts/check-package.mjs --bundle target/portable-windows-extracted
      - name: Check extracted Codex lifecycle without vendor requests
        timeout-minutes: 3
        run: node scripts/check-packaged-codex.mjs --bundle target/portable-windows-extracted
      - name: Check extracted functional runtime
        timeout-minutes: 10
        run: node scripts/check-packaged-functional.mjs --bundle target/portable-windows-extracted --receipt target/functional-receipt.json
      - name: Upload extracted functional receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-functional-receipt
          path: target/functional-receipt.json
          if-no-files-found: warn
      - name: Smoke extracted Windows terminal bridge
        timeout-minutes: 5
        shell: pwsh
        run: |
          node scripts/check-windows-terminal.mjs --bundle target/portable-windows-extracted 2>&1 | Tee-Object -FilePath target/windows-terminal-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload terminal smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-terminal-smoke-log
          path: target/windows-terminal-smoke.log
          if-no-files-found: ignore
      - name: Upload portable desktop
        uses: actions/upload-artifact@v4
        with:
          name: hive-desktop-windows-portable
          path: target/hive-desktop-windows-portable.zip
          if-no-files-found: error
      - name: Open the saved workspace in the extracted native application
        timeout-minutes: 4
        env:
          HIVE_WINDOWS_PREVIEW_PATH: target/windows-native-workspace.png
        run: node scripts/check-desktop-startup.mjs --bundle target/portable-windows-extracted
      - name: Upload native workspace preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-workspace
          path: |
            target/windows-*.png
          if-no-files-found: warn
  native-supervision:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.replay_run }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build runtime
        run: pnpm build:runtime
      - name: Test native process supervision
        run: cargo test --locked --manifest-path apps/desktop/Cargo.toml --no-default-features --features process-supervisor-check --bin process-supervisor-check -- --nocapture
  native-clis:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.replay_run }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build runtime
        run: pnpm build:runtime
      - name: Verify official external CLIs without inference
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:HIVE_WINDOWS_NATIVE_CLI_PREFIX = Join-Path $env:RUNNER_TEMP 'official native CLI space'
          npm install --global --prefix "$env:HIVE_WINDOWS_NATIVE_CLI_PREFIX" @earendil-works/pi-coding-agent@1.4.0 @openai/codex@0.166.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime exec tsx checks/windows-native-clis.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HIVE_PI_COMMAND = Join-Path $env:HIVE_WINDOWS_NATIVE_CLI_PREFIX 'pi.cmd'
          $env:HIVE_CODEX_COMMAND = Join-Path $env:HIVE_WINDOWS_NATIVE_CLI_PREFIX 'codex.cmd'
          pnpm --filter @hive-desktop/runtime check:programs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime check:files
          pnpm --filter @hive-desktop/runtime check:delivery-failures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hive-desktop/runtime check:pi-reasoning
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload external CLI check receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-cli-receipt
          path: |
            .artifacts/windows-native-clis.json
            .artifacts/program-check/*.json
            .artifacts/file-attachments/core-receipt.json
            .artifacts/file-attachments/wire-receipt.json
          if-no-files-found: warn
  replay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_run != '' }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      REPLAY_RUN: ${{ inputs.replay_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
      - name: Validate original run ID
        shell: pwsh
        run: |
          if ($env:REPLAY_RUN -cnotmatch '^[1-9][0-9]*$') { throw 'replay_run must be a positive integer.' }
      - name: Download original portable artifact
        uses: actions/download-artifact@v4
        with:
          name: hive-desktop-windows-portable
          path: target/replay-download
          run-id: ${{ env.REPLAY_RUN }}
          github-token: ${{ github.token }}
      - name: Extract and record provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = 'target/replay-download/hive-desktop-windows-portable.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Original portable zip is missing from artifact.' }
          $origin = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:REPLAY_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $origin.head_sha) { throw 'Could not read original run provenance.' }
          New-Item -ItemType Directory -Force -Path target | Out-Null
          [ordered]@{ originalRun = $env:REPLAY_RUN; originalHead = $origin.head_sha; fixtureHead = $env:GITHUB_SHA; archiveSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash } | ConvertTo-Json | Set-Content -Encoding utf8 target/replay-provenance.json
          Expand-Archive -LiteralPath $archive -DestinationPath target/replay-extracted
          if (-not (Test-Path -LiteralPath 'target/replay-extracted/hive-desktop.exe' -PathType Leaf)) { throw 'Extracted artifact is not a portable desktop bundle.' }
      - name: Replay native window fixture
        timeout-minutes: 4
        shell: pwsh
        env:
          HIVE_WINDOWS_PREVIEW_PATH: target/windows-replay-workspace.png
        run: |
          node scripts/check-desktop-startup.mjs --bundle target/replay-extracted 2>&1 | Tee-Object -FilePath target/windows-replay.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-replay-evidence
          path: |
            target/windows-*.png
            target/windows-replay.log
            target/replay-provenance.json
          if-no-files-found: warn
