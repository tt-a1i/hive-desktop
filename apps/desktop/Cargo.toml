[package]
name = "hive-desktop"
default-run = "hive-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
gpui-kit = { version = "=0.9.0", optional = true }
hive-terminal = { path = "../../crates/hive-terminal", optional = true }
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
tempfile = { version = "3", optional = true }
smol = "2"
similar = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "=0.57.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSBitmapImageRep", "NSGraphicsContext", "NSImage", "NSImageRep", "NSWorkspace", "objc2-core-graphics"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time"] }
webview2-com = { version = "=0.39.1", optional = true }
windows-core = { version = "=0.62.2", optional = true }

[features]
default = ["desktop"]
desktop = ["dep:chrono", "dep:gpui-kit", "dep:hive-terminal", "dep:tempfile", "dep:wry", "dep:webview2-com", "dep:windows-core"]
process-supervisor-check = []
ui-preview = []

[[bin]]
name = "hive-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "process-supervisor-check"
path = "src/process_supervisor/check.rs"
required-features = ["process-supervisor-check"]

[patch.crates-io]
gpui-pre = { path = "../../vendor/gpui-pre" }
