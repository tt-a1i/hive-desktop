[package]
name = "hive-desktop"
default-run = "hive-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
gpui-kit = { version = "=0.9.0", optional = true }
hive-terminal = { path = "../../crates/hive-terminal", optional = true }
tempfile = { version = "3", optional = true }
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:hive-terminal", "dep:tempfile"]
process-supervisor-check = []

[[bin]]
name = "hive-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "process-supervisor-check"
path = "src/process_supervisor/check.rs"
required-features = ["process-supervisor-check"]
